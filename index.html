<title>Unflagged Operation</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  /* Shown at once while Google starts the app; the app's own opening screen looks the same. */
  #boot { position: fixed; inset: 0; z-index: 2; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: system-ui, sans-serif; transition: opacity .35s; }
  #boot img { width: 72px; height: 72px; border-radius: 18px; }
  #boot b { font-size: 26px; }
  #boot i { width: 120px; height: 3px; border-radius: 3px; background: #333; overflow: hidden; position: relative; }
  #boot i::after { content: ''; position: absolute; inset: 0; width: 40%; background: #fff; border-radius: 3px; animation: boot 1.1s ease-in-out infinite; }
  @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  [dir=rtl] #boot i::after { animation-direction: reverse; }
</style>
